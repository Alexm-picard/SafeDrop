# AI-USAGE SUMMARY
# Tools: Claude Code
# Overall AI Contribution: ~90% (skeleton generated from team design documents)
# AI-Assisted Areas: three-container local stack (mongo replica set + init sidecar, backend, frontend)
# Human Contributions: pending team review (original two-service file by Alex Picard; mongo services added)
# Notes: Generated from SDD v0.1, SPPP, NFR doc, Sprint 1 backlog. Must be reviewed and tested by the owning team member before merge.
#
# Local development stack for SafeDrop (SDD §2.3.4, kickoff SCRUM-111).
#
# From the repository root:
#   docker compose up --build        # start mongo + backend + frontend
#   docker compose up --build -V     # same, but refresh node_modules after adding a dependency
#   docker compose down              # stop everything (keeps the mongo-data volume)
#   docker compose down -v           # stop everything and wipe the database
#
# Frontend: http://localhost:5173   (Vite dev server; /api/* is proxied to the backend container)
# Backend:  http://localhost:4000
# Mongo:    mongodb://localhost:27017/safedrop?replicaSet=rs0&directConnection=true
#
# Mongoose transactions require a replica set, so mongod runs with --replSet and the one-shot
# `mongo-init` sidecar runs rs.initiate() once the server is healthy. Migrations run when the backend
# container starts (dev convenience only). In staging/production they are a deploy step, never app boot.
#
# Values come from a root `.env` (copy .env.example) or fall back to the dev-only defaults below.

name: safedrop

services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo --quiet --eval "
        try {
          rs.status();
          print('replica set rs0 already initiated');
        } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
          print('replica set rs0 initiated');
        }
      "

  backend:
    build: ./code/backend
    command: sh -c "npm run migrate && npm run dev"
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/safedrop?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-not-for-deploy-change-me-0123456789abcdef}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_IDLE_TTL: ${JWT_REFRESH_IDLE_TTL:-30m}
      JWT_REFRESH_ABSOLUTE_TTL: ${JWT_REFRESH_ABSOLUTE_TTL:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      INVITE_TTL: ${INVITE_TTL:-72h}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-SafeDrop <no-reply@safedrop.local>}
    volumes:
      - ./code/backend:/app # bind mount so `node --watch` reloads on edits
      - /app/node_modules # keep the container's node_modules, not the host's
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    # Without this the container reports "Up" even when the Node process has died — `node --watch`
    # keeps PID 1 alive and waits for a file change, so a crash on boot (a missing dependency after
    # someone adds one without `-V`, a bad .env) looks healthy while every request is refused.
    # Probing /health makes that visible in `docker compose ps` rather than surfacing to whoever is
    # testing as an unexplained connection reset. busybox wget ships in the node:22-alpine base, and
    # start_period covers `npm run migrate` running before the server starts listening.
    # Note this only proves the process answers HTTP: /health does not yet check the database
    # connection, so a live process with a dead Mongo still reports healthy (see SCRUM-133).
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health > /dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./code/frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: ''
      VITE_DEV_PROXY_TARGET: http://backend:4000
    volumes:
      - ./code/frontend:/app # bind mount so Vite HMR picks up edits
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
